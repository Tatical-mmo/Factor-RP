<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>Fator RP</title>
<style>
  :root { --bg:#1b1f2a; --painel:rgba(20,24,34,.86); --borda:rgba(255,255,255,.12); --texto:#f1ede4; --suave:#a9b0bd; --destaque:#f2a33a; --verde:#5cc28a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #jogo { position:fixed; inset:0; display:block; }
  .oculto { display:none !important; }

  /* Tela de escolha */
  #escolha { position:fixed; inset:0; z-index:20; overflow-y:auto; touch-action:pan-y;
    background: radial-gradient(1200px 600px at 50% -10%, #3a4560 0%, var(--bg) 60%); padding: 24px 16px 120px; }
  #escolha h1 { margin:8px 0 2px; font-size: clamp(28px, 6vw, 44px); letter-spacing:1px; text-align:center; }
  #escolha h1 span { color:var(--destaque); }
  #escolha p.sub { margin:0 0 18px; text-align:center; color:var(--suave); }
  .grade { display:grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap:10px; max-width:980px; margin:0 auto; }
  .carta { background:rgba(255,255,255,.05); border:2px solid transparent; border-radius:14px; padding:6px 6px 8px; cursor:pointer;
    text-align:center; transition: transform .12s, border-color .12s, background .12s; }
  .carta:hover { transform: translateY(-2px); background:rgba(255,255,255,.09); }
  .carta.sel { border-color:var(--destaque); background:rgba(242,163,58,.14); }
  .carta img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  .carta div { font-size:13px; margin-top:2px; }
  #barraEscolha { position:fixed; left:0; right:0; bottom:0; z-index:21; display:flex; gap:10px; justify-content:center; align-items:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background:var(--painel); border-top:1px solid var(--borda); flex-wrap:wrap; }
  #nome { font-size:17px; padding:12px 14px; border-radius:10px; border:1px solid var(--borda); background:#0f131b; color:var(--texto); width:min(260px, 60vw); }
  .btn { font-size:16px; font-weight:700; padding:12px 20px; border-radius:10px; border:0; background:var(--destaque); color:#20160a; cursor:pointer; }
  .btn:disabled { opacity:.45; cursor:default; }
  #login { position:fixed; inset:0; z-index:22; display:flex; align-items:center; justify-content:center; padding:16px;
    background: radial-gradient(1200px 600px at 50% -10%, #3a4560 0%, var(--bg) 60%); }
  #login .cartao { width:min(380px, 100%); display:flex; flex-direction:column; gap:12px; }
  #login h1 { margin:0; font-size: clamp(34px, 9vw, 48px); text-align:center; letter-spacing:1px; }
  #login h1 span, #escolha h1 span { color:var(--destaque); }
  #login .sub { margin:0 0 6px; text-align:center; color:var(--suave); }
  #login input { font-size:17px; padding:13px 14px; border-radius:10px; border:1px solid var(--borda); background:#0f131b; color:var(--texto); }
  #login .linha { display:flex; gap:10px; } #login .linha .btn { flex:1; }
  .btn.sec { background:#2d3445; color:var(--texto); }
  #msgLogin { min-height:20px; text-align:center; font-size:14px; color:#ffb4a8; }
  #msgLogin.ok { color:var(--verde); }
  #info { pointer-events:auto; }
  #info .online { color:var(--verde); }
  #btSair { margin-top:4px; font-size:12px; padding:4px 10px; border-radius:8px; border:1px solid var(--borda); background:transparent; color:var(--suave); cursor:pointer; }
  #erroNome { width:100%; text-align:center; color:#ff8a7a; font-size:13px; min-height:16px; margin:-4px 0 0; }

  /* Carregando */
  #carregando { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--bg); }
  #carregando .barra { width:min(320px, 70vw); height:10px; border-radius:6px; background:#2b3242; overflow:hidden; }
  #carregando .barra i { display:block; height:100%; width:0; background:var(--destaque); transition:width .15s; }
  #carregando small { color:var(--suave); }

  /* HUD */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  .painel { background:var(--painel); border:1px solid var(--borda); border-radius:12px; padding:8px 12px; }
  #info { position:absolute; left:calc(10px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top)); font-size:14px; line-height:1.45; }
  #info b { color:var(--destaque); }
  #rua { position:absolute; left:50%; transform:translateX(-50%); top:calc(10px + env(safe-area-inset-top)); font-size:14px; white-space:nowrap; }
  #mapa { position:absolute; right:calc(10px + env(safe-area-inset-right)); top:calc(10px + env(safe-area-inset-top)); border-radius:12px; border:1px solid var(--borda); width:150px; height:150px; }
  #dica { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom)); font-size:15px; }
  #ajuda { position:absolute; left:calc(10px + env(safe-area-inset-left)); bottom:calc(10px + env(safe-area-inset-bottom)); font-size:12.5px; color:var(--suave); line-height:1.5; }
  #ajuda kbd { color:var(--texto); font-family:inherit; font-weight:700; }
  #aviso { position:absolute; left:50%; top:22%; transform:translateX(-50%); font-size:15px; max-width:86vw; text-align:center; transition:opacity .3s; }

  #btPainel { position:absolute; left:calc(10px + env(safe-area-inset-left)); top:calc(288px + env(safe-area-inset-top)); pointer-events:auto;
    font-size:14px; font-weight:700; padding:8px 14px; border-radius:10px; border:1px solid var(--borda); background:#3a2a10; color:#ffd08a; cursor:pointer; }
  #bloqueio { position:absolute; left:50%; bottom:calc(200px + env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:16px; font-weight:700;
    background:rgba(120,20,20,.85); border:1px solid #ff8a7a; border-radius:12px; padding:8px 16px; white-space:nowrap; }
  .tagc { font-style:normal; font-size:11px; padding:1px 6px; border-radius:6px; margin-left:4px; }
  .tagc.admin { background:#7a1f1f; } .tagc.moderador { background:#1f3f7a; } .tagc.imortal { background:#5b3b8a; }

  /* Painel */
  .modal { position:fixed; z-index:25; inset:auto; left:50%; top:50%; transform:translate(-50%,-50%); width:min(560px, 96vw); max-height:88vh;
    display:flex; flex-direction:column; background:#151a24; border:1px solid var(--borda); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.5); touch-action:pan-y; }
  .modal .topo { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--borda); }
  .modal .topo button { background:none; border:0; color:var(--texto); font-size:20px; cursor:pointer; }
  .modal .abas { display:flex; gap:6px; padding:10px 12px 0; flex-wrap:wrap; }
  .modal .abas button { flex:1; min-width:90px; padding:9px; border-radius:9px; border:1px solid var(--borda); background:#202737; color:var(--suave); font-weight:700; cursor:pointer; }
  .modal .abas button.sel { background:var(--destaque); color:#20160a; }
  .modal .conteudo { overflow-y:auto; padding:12px 14px; flex:1; }
  .modal .conteudo input:not([type=checkbox]) { font-size:15px; padding:9px 10px; border-radius:8px; border:1px solid var(--borda); background:#0f131b; color:var(--texto); min-width:0; flex:1; }
  #pBusca { width:100%; }
  .modal .conteudo .sub { margin:14px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--suave); }
  .modal .conteudo .botoes { display:flex; gap:8px; flex-wrap:wrap; }
  .modal .conteudo .botoes button, .modal .conteudo .voltar, .chip { padding:9px 13px; border-radius:9px; border:0; background:#2d3650; color:var(--texto); font-weight:700; cursor:pointer; }
  .modal .conteudo .botoes button.perigo { background:#8a2525; } .modal .conteudo .botoes button.ativo { background:#5b3b8a; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; } .chip { padding:6px 11px; background:#1f4a35; }
  .lista { display:flex; flex-direction:column; gap:6px; }
  .lista .linha { text-align:left; padding:10px 12px; border-radius:10px; border:1px solid var(--borda); background:#1b2130; color:var(--texto); cursor:pointer; }
  .lista .linha small { color:var(--suave); }
  .tag { font-style:normal; font-size:11px; padding:1px 7px; border-radius:6px; background:#333c52; margin-left:2px; }
  .tag.admin { background:#7a1f1f; } .tag.moderador { background:#1f3f7a; } .tag.on { background:#1f6b3a; } .tag.ruim { background:#7a4a1f; }
  .ficha { display:flex; gap:12px; align-items:center; margin-top:8px; } .ficha img { width:84px; height:84px; object-fit:contain; background:#202737; border-radius:12px; }
  .ficha .grande { font-size:19px; }
  .poderes { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; margin:8px 0; font-size:14px; }
  .skins { display:grid; grid-template-columns:repeat(auto-fill, minmax(86px, 1fr)); gap:8px; }
  .skin { background:#1b2130; border:2px solid transparent; border-radius:10px; padding:4px; color:var(--texto); cursor:pointer; font-size:11px; }
  .skin.sel { border-color:var(--destaque); } .skin img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  .vazio, .dica { color:var(--suave); font-size:13px; }
  .aviso-item { font-size:13px; background:rgba(227,178,60,.14); border:1px solid rgba(227,178,60,.45); border-radius:8px; padding:6px 9px; margin:6px 0; }
  .modal .msg { min-height:22px; padding:6px 14px 12px; font-size:14px; } .modal .msg.ok { color:var(--verde); } .modal .msg.erro { color:#ff8a7a; }

  .item { display:flex; align-items:center; gap:10px; cursor:default; }
  .item .ic { font-size:24px; } .item .nm { flex:1; display:flex; flex-direction:column; } .item .nm small { color:var(--suave); }
  .item .bts { display:flex; gap:6px; }
  .item .bts button { padding:8px 12px; border-radius:8px; border:0; background:#2d3650; color:var(--texto); font-weight:700; cursor:pointer; }
  .item .bts button:disabled { opacity:.35; cursor:default; }
  #btMochila { position:absolute; left:calc(10px + env(safe-area-inset-left)); top:calc(150px + env(safe-area-inset-top)); pointer-events:auto;
    font-size:14px; font-weight:700; padding:8px 14px; border-radius:10px; border:1px solid var(--borda); background:#1f3a2c; color:#bff0d2; cursor:pointer; }
  #btEmpresa { position:absolute; left:calc(10px + env(safe-area-inset-left)); top:calc(196px + env(safe-area-inset-top)); pointer-events:auto;
    font-size:14px; font-weight:700; padding:8px 14px; border-radius:10px; border:1px solid var(--borda); background:#1f2c45; color:#bcd4ff; cursor:pointer; }
  .modal .abas:empty { display:none; }
  #btCla { position:absolute; left:calc(10px + env(safe-area-inset-left)); top:calc(242px + env(safe-area-inset-top)); pointer-events:auto;
    font-size:14px; font-weight:700; padding:8px 14px; border-radius:10px; border:1px solid var(--borda); background:#3a1f22; color:#ffc2c2; cursor:pointer; }
  #btFianca { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(250px + env(safe-area-inset-bottom)); pointer-events:auto;
    font-size:15px; font-weight:700; padding:10px 18px; border-radius:10px; border:0; background:var(--destaque); color:#20160a; cursor:pointer; }
  #captura { position:absolute; left:50%; transform:translateX(-50%); top:calc(60px + env(safe-area-inset-top)); font-size:14px; min-width:220px; text-align:center; }
  #captura i { display:block; height:6px; margin-top:6px; border-radius:3px; background:var(--destaque); }
  .vida { display:inline-block; width:70px; height:8px; border-radius:4px; background:#3a2020; vertical-align:middle; overflow:hidden; margin-left:4px; }
  .vida i { display:block; height:100%; background:#4cc26f; } .vida.baixa i { background:#e05a4f; }
  .cartoes { display:flex; gap:8px; flex-wrap:wrap; } .cartoes div { flex:1; min-width:90px; background:#1b2130; border:1px solid var(--borda); border-radius:10px; padding:8px 10px; }
  .cartoes small { display:block; color:var(--suave); font-size:12px; } .cartoes b { font-size:20px; }
  .form { display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .form label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--suave); }
  .modal select, .modal .form input { font-size:15px; padding:9px 10px; border-radius:8px; border:1px solid var(--borda); background:#0f131b; color:var(--texto); }
  .form button, .linha .bts button { padding:9px 13px; border-radius:9px; border:0; background:#2d3650; color:var(--texto); font-weight:700; cursor:pointer; }
  .form button { background:var(--destaque); color:#20160a; }
  .form label.check { flex-direction:row; align-items:center; gap:8px; }
  .linha .bts { display:flex; gap:6px; margin-top:6px; }
  .botoes button.perigo { background:#8a2525 !important; }
  .fome { display:inline-block; width:70px; height:8px; border-radius:4px; background:#3a2a20; vertical-align:middle; overflow:hidden; margin-left:4px; }
  .fome i { display:block; height:100%; background:#e7a43c; } .fome.vazia i { background:#e05a4f; }
  /* Controles de toque */
  #toque { position:fixed; inset:0; pointer-events:none; z-index:11; }
  #joy { position:absolute; left:calc(22px + env(safe-area-inset-left)); bottom:calc(22px + env(safe-area-inset-bottom)); width:130px; height:130px; border-radius:50%;
    background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.18); pointer-events:auto; touch-action:none; }
  #joy i { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:rgba(255,255,255,.35); }
  #botoes { position:absolute; right:calc(16px + env(safe-area-inset-right)); bottom:calc(18px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(2, 66px); gap:10px; pointer-events:auto; }
  .bt { width:66px; height:66px; border-radius:50%; border:2px solid rgba(255,255,255,.25); background:rgba(20,24,34,.7); color:var(--texto);
    font-size:12.5px; font-weight:700; touch-action:none; }
  .bt:active, .bt.ativo { background:rgba(242,163,58,.55); }
  #girar { position:absolute; right:calc(10px + env(safe-area-inset-right)); top:calc(170px + env(safe-area-inset-top)); display:flex; gap:8px; pointer-events:auto; }
  #girar .bt { width:46px; height:46px; font-size:18px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm",
  "./js/main.js": "./js/main.js?v=20261108d",
  "./js/mundo.js": "./js/mundo.js?v=20261108d",
  "./js/ferrovia.js": "./js/ferrovia.js?v=20261108d",
  "./js/cla.js": "./js/cla.js?v=20261108d",
  "./js/config.js": "./js/config.js?v=20261108d",
  "./js/empresa.js": "./js/empresa.js?v=20261108d",
  "./js/loja.js": "./js/loja.js?v=20261108d",
  "./js/painel.js": "./js/painel.js?v=20261108d",
  "./js/rede.js": "./js/rede.js?v=20261108d",
  "./js/sedes.js": "./js/sedes.js?v=20261108d"
} }
</script>
</head>
<body>
<canvas id="jogo"></canvas>

<section id="login">
  <div class="cartao">
    <h1>FATOR <span>RP</span></h1>
    <p class="sub">Entre na sua conta ou crie uma nova.</p>
    <input id="email" type="email" placeholder="E-mail" autocomplete="email">
    <input id="senha" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password">
    <div class="linha">
      <button class="btn" id="btEntrar">Entrar</button>
      <button class="btn sec" id="btCriar">Criar conta</button>
    </div>
    <div id="msgLogin"></div>
  </div>
</section>

<section id="escolha" class="oculto">
  <h1>FATOR <span>RP</span></h1>
  <p class="sub">Escolha seu personagem e o nome que a cidade vai conhecer. O nome não pode ser repetido.</p>
  <div class="grade" id="grade"></div>
</section>
<div id="barraEscolha" class="oculto">
  <input id="nome" maxlength="16" placeholder="Seu nome no jogo" autocomplete="off">
  <button class="btn" id="entrar" disabled>Criar personagem</button>
  <div id="erroNome"></div>
</div>

<div id="carregando" class="oculto">
  <div>Carregando a cidade…</div>
  <div class="barra"><i id="progresso"></i></div>
  <small id="progressoTxt">0%</small>
</div>

<div id="hud" class="oculto">
  <div id="info" class="painel"></div>
  <div id="rua" class="painel">—</div>
  <canvas id="mapa" width="300" height="300"></canvas>
  <div id="dica" class="painel oculto"></div>
  <div id="aviso" class="painel" style="opacity:0"></div>
  <div id="ajuda" class="painel oculto"></div>
  <button id="btMochila">🎒 Mochila</button>
  <button id="btEmpresa">🏢 Empresa</button>
  <button id="btCla">⚔ Clã</button>
  <button id="btFianca" class="oculto">Pagar fiança</button>
  <div id="captura" class="painel oculto"></div>
  <button id="btPainel" class="oculto">🛡 Painel</button>
  <div id="bloqueio" class="oculto"></div>
</div>

<div id="painel" class="modal oculto">
  <div class="topo"><b>Painel da equipe</b><button id="fecharPainel" aria-label="Fechar">✕</button></div>
  <div class="abas">
    <button data-aba="jogadores">Jogadores</button><button data-aba="eu">Eu</button>
    <button data-aba="equipe" class="soAdmin">Equipe</button><button data-aba="historico" class="soAdmin">Histórico</button>
  </div>
  <div id="painelConteudo" class="conteudo"></div>
  <div id="painelMsg" class="msg"></div>
</div>

<div id="empresaJanela" class="modal oculto">
  <div class="topo"><b id="empresaTitulo">Empresa</b><button id="fecharEmpresa" aria-label="Fechar">✕</button></div>
  <div class="abas" id="empresaAbas"></div>
  <div id="empresaConteudo" class="conteudo"></div>
  <div id="empresaMsg" class="msg"></div>
</div>

<div id="claJanela" class="modal oculto">
  <div class="topo"><b id="claTitulo">Clã</b><button id="fecharCla" aria-label="Fechar">✕</button></div>
  <div id="claConteudo" class="conteudo"></div>
  <div id="claMsg" class="msg"></div>
</div>

<div id="janela" class="modal oculto">
  <div class="topo"><b id="janelaTitulo">Loja</b><button id="fecharJanela" aria-label="Fechar">✕</button></div>
  <div id="janelaConteudo" class="conteudo"></div>
  <div id="janelaMsg" class="msg"></div>
</div>

<div id="toque" class="oculto">
  <div id="joy"><i></i></div>
  <div id="botoes">
    <button class="bt" id="btAcao">Pegar</button>
    <button class="bt" id="btSoco">Soco</button>
    <button class="bt" id="btArma">Arma</button>
    <button class="bt" id="btTiro">Atirar</button>
  </div>
  <div id="girar"><button class="bt" id="btGiraE">⟲</button><button class="bt" id="btGiraD">⟳</button></div>
</div>

<div id="versao" style="position:fixed;left:6px;bottom:4px;font:10px sans-serif;color:rgba(255,255,255,.55);pointer-events:none;z-index:5">versão 08/11 · níveis 15</div>
<script type="module">import './js/main.js';</script>
</body>
</html>
